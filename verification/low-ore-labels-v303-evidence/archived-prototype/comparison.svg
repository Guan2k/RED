4" y="795" font-size="14" fill="#dce5d7">标签宽度改变可能触发原有候选位置 / 边缘 clamp；实际回放继续使用 measureText，没有手调位置。</text><text x="24" y="824" font-size="12" fill="#dce5d7">矿块、颜色、半径、经济与悬停均不改。此页隔离比较字样；原有重叠回退限制仍保留。</text></svg>